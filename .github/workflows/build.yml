name: core-mod build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['core-mod/**', 'modpack/**', '.github/workflows/**', 'tools/build_royalqol.sh', 'tools/*mrpack*.py', 'tools/fetch_mods.py']
  pull_request:
    paths: ['core-mod/**', 'modpack/**', '.github/workflows/**', 'tools/build_royalqol.sh', 'tools/*mrpack*.py', 'tools/fetch_mods.py']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '입력하면 이 이름으로 태그와 테스트 팩 Release를 만듭니다 (예: v0.1.0)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트
        working-directory: core-mod
        run: ./gradlew build --no-daemon

      - name: 도구 자체 검사 (check_mods.py, build/install_mrpack.py)
        working-directory: tools
        run: python3 -m unittest -v test_check_mods test_mrpack

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core-mod/build/reports/tests/test/
          if-no-files-found: ignore

      - name: 테스트 팩 구성
        run: |
          mkdir -p testpack/mods testpack/datapacks
          find core-mod/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} testpack/mods/ \;
          # 필수 의존 모드 magiccity (빌드 때 JitPack에서 받은 같은 커밋의 jar)
          MC_COMMIT=$(grep '^magiccity_commit=' core-mod/gradle.properties | cut -d= -f2)
          # 캐시에 예전 커밋 jar가 남아 있을 수 있어서 gradle.properties 의 커밋 jar 하나만 고른다
          find ~/.gradle/caches -path '*com.github.aswq0258*' -name "magic-city-mod-${MC_COMMIT}.jar" -exec cp {} testpack/mods/ \;
          bash tools/build_royalqol.sh modpack/mods.lock.json testpack/mods
          # 챕터 보스 모드 fantasybosses (magic-city-mod 고정 커밋 빌드, 2026-11-20)
          bash tools/build_fantasybosses.sh modpack/mods.lock.json testpack/mods
          # 주소가 없는 외부 모드 jar (modpack/local-mods/, 2026-11-21 Combat Traces)
          cp modpack/local-mods/*.jar testpack/mods/
          ls testpack/mods
          # magiccity jar가 게임에 넣을 수 있는 모드 jar인지 확인
          unzip -l testpack/mods/magic-city-mod-*.jar | grep -q 'META-INF/neoforge.mods.toml' && echo 'magiccity mods.toml 확인' || { echo 'magiccity jar에 neoforge.mods.toml 없음'; exit 1; }
          cp -r modpack/datapacks/fantasyrpg_content modpack/datapacks/fantasyrpg_test testpack/datapacks/
          cp -r modpack/kubejs testpack/kubejs
          cp docs/TESTING.md testpack/TESTING.md
          (cd testpack && zip -qr ../fantasyrpg-testpack.zip .)

      - name: 테스트 팩 업로드
        uses: actions/upload-artifact@v4
        with:
          name: fantasyrpg-testpack
          path: testpack/

      # 통합 테스트 팩: 우리 모드 3개 + 챕터 보스 모드 fantasybosses + 외부 모드 18개(주소만). Prism Launcher 에서 가져오기 한 번으로 설치
      - name: 통합 팩(.mrpack) 만들기
        run: |
          VER="$(grep '^mod_version=' core-mod/gradle.properties | cut -d= -f2)-$(git rev-parse --short HEAD)"
          python3 tools/fetch_mods.py modpack/mods.lock.json external
          python3 tools/build_mrpack.py --lock modpack/mods.lock.json --resolved external/resolved.json \
            --ours testpack/mods --datapacks modpack/datapacks --guide docs/TESTING.md --version "$VER" \
            --out magic-kingdom-testpack.mrpack
          # launcher 처럼 설치해 보고(주소·해시 확인) 모드 25개(우리 3 + fantasybosses + Combat Traces + 주소 20)가 모이는지 확인
          python3 tools/install_mrpack.py magic-kingdom-testpack.mrpack packcheck
          test "$(ls packcheck/mods/*.jar | wc -l)" -eq 25
          test -f packcheck/mods/fantasybosses-0.8.0.jar
          test -f packcheck/mods/combattraces-1.1.0.jar

      - name: 통합 팩 업로드
        uses: actions/upload-artifact@v4
        with:
          name: magic-kingdom-testpack-mrpack
          path: magic-kingdom-testpack.mrpack

      - name: 릴리스 (v* 태그 push 또는 수동 실행 시 release_tag 입력)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          mv fantasyrpg-testpack.zip "fantasyrpg-testpack-${TAG}.zip"
          mv magic-kingdom-testpack.mrpack "magic-kingdom-testpack-${TAG}.mrpack"
          gh release create "$TAG" "magic-kingdom-testpack-${TAG}.mrpack" "fantasyrpg-testpack-${TAG}.zip" --target "$GITHUB_SHA" \
            --title "$TAG 테스트 팩" --notes-file docs/TESTING.md --prerelease
