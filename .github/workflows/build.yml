name: core-mod build

on:
  push:
    paths: ['core-mod/**', '.github/workflows/**']
  pull_request:
    paths: ['core-mod/**', '.github/workflows/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fantasyrpg-core
          path: core-mod/build/libs/*.jar
