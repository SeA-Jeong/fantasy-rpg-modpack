name: modpack smoke (모드 혼합 서버 기동 검사)

# 1차 외부 모드 구성(modpack/mods.lock.json)과 우리 모드(fantasyrpg + magiccity)를 함께
# NeoForge 전용 서버에 넣어 실제로 기동되는지 확인한다. 클라이언트 화면은 검증하지 않는다.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'modpack/mods.lock.json'
      - 'tools/fetch_mods.py'
      - 'tools/smoke_server.py'
      - 'tools/build_royalqol.sh'
      - 'tools/install_mrpack.py'
      - 'tools/build_mrpack.py'
      - 'tools/check_mods.py'
      - '.github/workflows/modpack-smoke.yml'
      - 'tools/build_fantasybosses.sh'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: 우리 모드 빌드 (fantasyrpg + JitPack magiccity)
        working-directory: core-mod
        run: ./gradlew build -x test --no-daemon

      - name: 우리 모드 jar 모으기 (fantasyrpg + magiccity + royalqol)
        run: |
          mkdir -p ours
          find core-mod/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} ours/ \;
          MC_COMMIT=$(grep '^magiccity_commit=' core-mod/gradle.properties | cut -d= -f2)
          # 캐시에 예전 커밋 jar가 남아 있을 수 있어서 gradle.properties 의 커밋 jar 하나만 고른다
          find ~/.gradle/caches -path '*com.github.aswq0258*' -name "magic-city-mod-${MC_COMMIT}.jar" -exec cp {} ours/ \;
          bash tools/build_royalqol.sh modpack/mods.lock.json ours
          ls -la ours

      - name: 외부 모드 받기 (mods.lock.json)
        run: |
          mkdir -p external
          python3 tools/fetch_mods.py modpack/mods.lock.json external --side server

      - name: NeoForge 전용 서버 설치
        run: |
          NEO=$(python3 -c "import json;print(json.load(open('modpack/mods.lock.json'))['neoforge'])")
          curl -fsSL -o neoforge-installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEO}/neoforge-${NEO}-installer.jar"
          mkdir -p server
          (cd server && java -jar ../neoforge-installer.jar --installServer . > ../installer.log 2>&1) || { tail -50 installer.log; exit 1; }
          ls server

      - name: "1단계: 우리 모드만 — 의존성 검사"
        # royalqol 의 JEI·JourneyMap 의존성은 클라이언트 전용이라 서버 기준으로 검사
        run: python3 tools/check_mods.py ours --side server --neoforge "$(python3 -c "import json;print(json.load(open('modpack/mods.lock.json'))['neoforge'])")"

      - name: "1단계: 우리 모드만 — 서버 기동"
        run: |
          python3 tools/smoke_server.py server ours \
            --command "magiccity status" \
            --command "magiccity quest list" \
            --command "rpg simulate 100 2.0 0 0.25 0=>150"
          mkdir -p smoke-logs/stage1 && cp -r server/logs smoke-logs/stage1/ 2>/dev/null || true
          cp -r server/crash-reports smoke-logs/stage1/ 2>/dev/null || true
          # 계열 방어구 수치표 5계열이 오류 없이 로드됐는지
          grep -E "\[방어구\] 계열 수치표 5개 로드, 오류 0건" server/logs/latest.log
          # 룬석 효과 8종(직업 룬석 2종 포함)이 오류 없이 로드되고, 우리 조합식에 읽기 오류가 없는지
          grep -E "\[룬석\] 룬석 효과 8개 로드, 오류 0건" server/logs/latest.log
          # 성장 데이터(레벨 곡선·몬스터 경험치)가 읽혔는지
          grep -E "\[성장\] 레벨 곡선 need" server/logs/latest.log
          # 기본 공격 수치가 읽혔는지
          grep -E "\[전투\] 기본 공격 로드: .*\(합계 상한 50%\)" server/logs/latest.log
          # 파티(회복·방벽·경험치)와 마스터리 교체 마을 조건 설정이 읽혔는지 (2026-11-21)
          grep -E "\[파티\] 회복 16\.0칸 ×0\.5, 방벽 16\.0칸 ×0\.5, 경험치 48\.0칸 \+0\.2/명" server/logs/latest.log
          grep -E "\[스킬\] 장착 프리셋 해금 레벨 \[1, 20, 40\], 마스터리 교체 마을 안에서만 true" server/logs/latest.log
          grep -E "\[스킬\] 비용: 노드 되돌리기 0개, 전체 초기화 1개, 빌드 바꾸기 1개, 직업 변경 2개 항목" server/logs/latest.log
          # 기사 기본 가드 수치와 장착 프리셋 해금 레벨이 읽혔는지
          grep -E "\[전투\] 기본 가드 로드" server/logs/latest.log
          grep -E "\[스킬\] 장착 프리셋 해금 레벨" server/logs/latest.log
          # 유산 무기 설정(특성·강화 비용)이 읽혔는지
          grep -E "\[유산\] 설정 로드: 특성 4방향, 강화 비용 9단계" server/logs/latest.log
          # 스킬: 6직업 전체 156노드, 코어 6개, 공통 패시브 로더가 오류 없이 돌았는지
          grep -E "\[스킬\] 스킬 노드 156개\(6직업\) 로드, 오류 0건" server/logs/latest.log
          grep -E "\[스킬\] 제어 면역" server/logs/latest.log
          grep -E "\[스킬\] 공통 패시브 노드 [0-9]+개 로드, 오류 0건" server/logs/latest.log
          grep -E "\[스킬\] 직업 코어 6개 로드, 오류 0건" server/logs/latest.log
          if grep -E "Parsing error loading recipe fantasyrpg" server/logs/latest.log; then echo "fantasyrpg 조합식 읽기 오류"; exit 1; fi
          # magiccity 개인 퀘스트(1장 왕의 소명)와 서장 NPC 정의가 오류 없이 읽혔는지
          # 1~12장 퀘스트 12개(중간 단계 자리 이름까지 읽혀야 오류 0), 퀘스트 NPC 14명(시종장 + 지역 의뢰 9 + 심층 광산 문지기·광부 3)
          grep -E "\[퀘스트\] 퀘스트 12개 로드, 오류 0건" server/logs/latest.log
          grep -E "\[퀘스트\] 퀘스트 NPC 14명 로드" server/logs/latest.log
          # magiccity 보스 고정 피해 패턴 12개와 피해 유형 태그가 오류 없이 읽혔는지
          grep -E "\[보스 패턴\] 고정 피해 패턴 12개 로드, 오류 0건" server/logs/latest.log
          # 필드보스 꾸러미 10개, 전장 차원 데이터가 오류 없이 읽혔는지
          grep -E "\[필드보스\] 꾸러미 10개 로드, 오류 0건" server/logs/latest.log
          # 보스 방 복사 범위 12개·챕터 보스 소재 7개, 작업대 조합식 13개·방어구 제작표 (2026-11-20)
          grep -E "\[보스 전장\] 보스 방 범위 12개 로드, 오류 0건" server/logs/latest.log
          grep -E "\[보스 전장\] 챕터 보스 소재 12개 로드, 오류 0건" server/logs/latest.log
          grep -E "\[제작\] 작업대 조합식 23개 로드, 오류 0건" server/logs/latest.log
          grep -E "\[제작\] 분해: minecraft:grindstone \+ 갑옷 → 재료 50%, 계열 전환: 핵심 부품은 4급부터" server/logs/latest.log
          # 계열 방어구 세트 효과 5계열 (2026-11-21)
          grep -E "\[방어구\] 세트 효과 5개 계열 로드, 오류 0건" server/logs/latest.log
          # 룬석 몬스터 드롭 설정 (2026-11-21)
          grep -E "\[룬석\] 몬스터 드롭 로드: 원석 5\.0%, 하급 룬석 0\.5% \(8종\), 오류 0건" server/logs/latest.log
          grep -E "\[제작\] 방어구 제작표 로드: 계열 5개" server/logs/latest.log
          # 보스 수치 데이터(챕터 12·등급표·필드 10)와 외부 보스 연결 (2026-11-20). 1단계는 fantasybosses 가 없으므로 기본 보스로 대신
          grep -E "\[보스\] 챕터 보스 수치 12개·등급표 1개 로드, 오류 0건" server/logs/latest.log
          grep -E "\[보스\] 필드보스 수치 10개 로드, 오류 0건" server/logs/latest.log
          grep -E "\[보스\] 외부 보스 연결 1개 로드 \(몹 있음 0, 몹 없음 → 기본 보스 1\), 오류 0건" server/logs/latest.log
          if grep -E "(Couldn't parse|Parsing error).*fantasyrpg:(family_armor_create|workbench_4x4)" server/logs/latest.log; then echo "작업대 조합식 오류"; exit 1; fi
          # 바닐라 전투 인챈트 22종 효과 없음·보호 최대 레벨 3·2·2·2 (정책 P2, 2026-11-21)
          grep -E "\[인챈트\] 전투 인챈트 22종 중 효과 없음 22종, 보호 최대 레벨 3·2·2·2, 오류 0건" server/logs/latest.log
          if grep -E "(Failed to (load|parse)|Couldn't (load|parse)|Errors in registry).*enchantment" server/logs/latest.log; then echo "인챈트 데이터 오류"; exit 1; fi
          if grep -E "(Failed to (load|parse)|Couldn't (load|parse)).*(boss_arena|dimension_type)" server/logs/latest.log; then echo "전장 차원 데이터 오류"; exit 1; fi
          if grep -E "(Couldn't load tag|missing references).*damage_type" server/logs/latest.log; then echo "피해 유형 태그 읽기 오류"; exit 1; fi

      - name: "통합 팩(.mrpack) 만들기·설치"
        run: |
          # 챕터 보스 모드 fantasybosses(GeckoLib 필요)는 1단계 뒤에 더함 (magic-city-mod 고정 커밋 빌드)
          bash tools/build_fantasybosses.sh modpack/mods.lock.json ours
          python3 tools/build_mrpack.py --lock modpack/mods.lock.json --resolved external/resolved.json \
            --ours ours --datapacks modpack/datapacks --guide docs/TESTING.md --version smoke --out smoke.mrpack
          python3 tools/install_mrpack.py smoke.mrpack packinst
          mkdir -p full && cp packinst/mods/*.jar full/
          ls full | wc -l

      - name: "전체 구성: 의존성 검사"
        # 판정은 NeoForge 가 직접 하는 서버 기동 단계가 기준이다. 여기서 나온 오류는 기록만 하고 다음 단계로 간다.
        continue-on-error: true
        run: |
          for j in external/jei-*.jar; do echo "== $j 의 minecraft 범위"; unzip -p "$j" META-INF/neoforge.mods.toml | grep -A3 'modId *= *"minecraft"' || true; done
          echo "check_mods 결과:"
          python3 tools/check_mods.py full --neoforge "$(python3 -c "import json;print(json.load(open('modpack/mods.lock.json'))['neoforge'])")"

      - name: "전체 구성: 서버 기동"
        run: |
          python3 tools/smoke_server.py server full \
            --command "magiccity status" \
            --command "rpg simulate 100 2.0 0 0.25 0=>150"
          # royalqol 은 클라이언트 전용: 서버 모드 목록에 올라오고(로딩 오류 없이) 진입점은 만들어지지 않아야 한다
          grep -E "Royal QoL .*\(royalqol\)" server/logs/latest.log
          # 외부 보스 모드가 서버에서 불러지고 3장 연결이 그 몹을 찾는지 (2026-11-20)
          grep -E "\[보스\] 외부 보스 연결 1개 로드 \(몹 있음 1, 몹 없음 → 기본 보스 0\), 오류 0건" server/logs/latest.log
          grep -E "FantasyBosses 0\.8\.0 \(fantasybosses\)" server/logs/latest.log

      - name: 로그 보관
        if: always()
        run: |
          mkdir -p smoke-logs/full
          cp -r server/logs smoke-logs/full/ 2>/dev/null || true
          cp -r server/crash-reports smoke-logs/full/ 2>/dev/null || true
          cp external/resolved.json smoke-logs/ 2>/dev/null || true
          cp installer.log smoke-logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
