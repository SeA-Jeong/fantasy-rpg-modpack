plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 개발 실행(runClient/runServer)에만 넣고 배포 jar 의존성에는 넣지 않는 구성 (NeoForge MDK와 같음)
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    // magiccity 공개 API (커밋 해시로 고정). JitPack에서는 magiccity만 받는다
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.aswq0258' }
    }
    // Modrinth 메이븐: 외부 모드(Better Combat 등)를 컴파일 참조용으로만 받는다
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // JEI API: 작업대 조합식을 JEI에 보여 주는 플러그인 컴파일용 (2026-11-20)
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    // magiccity 진행도 API: 컴파일할 때만 참조하고 배포 jar에는 넣지 않는다 (게임에서는 magiccity jar를 mods 폴더에 따로 둔다)
    compileOnly "com.github.aswq0258:magic-city-mod:${magiccity_commit}"
    // runClient / runServer 개발 실행에서만 magiccity를 함께 띄운다
    localRuntime "com.github.aswq0258:magic-city-mod:${magiccity_commit}"
    // Better Combat 연동 실험 준비 (설계: 프로젝트 문서 claude/혼합개발_연동설계_v1.md C-4).
    // 컴파일 참조만 하고 배포 jar·테스트 팩에는 넣지 않는다. 연동 코드는 compat/bettercombat 에서 ModList 확인 후에만 로드
    compileOnly "maven.modrinth:better-combat:${bettercombat_version}"
    // JEI 플러그인(compat/jei): 컴파일 참조만. JEI가 없으면 플러그인 클래스가 로드되지 않음
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // 순수 로직 단위 테스트에는 Minecraft 클래스패스가 없으므로 JSON 파싱용 Gson만 추가 (MC 1.21.1과 같은 버전)
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // 테스트는 빠르므로 캐시 결과를 재사용하지 않고 항상 실행 (CI 로그에 결과가 항상 남도록)
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    // CI 로그에서 테스트별 결과와 합계를 바로 볼 수 있게 출력
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "테스트 합계: ${result.testCount}개, 성공 ${result.successfulTestCount}, 실패 ${result.failedTestCount}, 건너뜀 ${result.skippedTestCount}"
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
