modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 진행도(등급) API. fantasyrpg → magiccity 단방향 필수 의존성
[[dependencies.${mod_id}]]
modId = "magiccity"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

# GeckoLib: 개발자 전용 테스트 장비(devtest)의 입체 갑옷 렌더러만 쓴다. 없으면 테스트 장비를 켜지 않을 뿐 (선택 의존)
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "optional"
versionRange = "[4.7,5)"
ordering = "AFTER"
side = "BOTH"
